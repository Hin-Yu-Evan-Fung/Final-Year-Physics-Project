name: Cross-Platform Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Configure Homebrew LLVM (macOS only)
      if: matrix.os == 'macos-latest'
      run: |
        brew install llvm
        echo "CC=$(brew --prefix llvm)/bin/clang" >> $GITHUB_ENV
        echo "CXX=$(brew --prefix llvm)/bin/clang++" >> $GITHUB_ENV

    - name: Set up CMake
      uses: threeal/cmake-action@v2
      with:
          run-build: true

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'
        cache: 'pip'

    - name: Run C++ tests
      run: ./build/hpmc_tests

    - name: Install Python Requirements & Main Packages
      run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

    - name: Run pytest
      run: pytest

