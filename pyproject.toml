[build-system]
requires = ["scikit-build-core >=0.4.3", "nanobind >=1.3.2"]
build-backend = "scikit_build_core.build"

[project]
name = "hsmc"
version = "0.0.1"
description = "Hard Particle Monte Carlo Simulation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.22.0",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6"
]

[project.optional-dependencies]
dev = [
    "scikit-build-core>=0.10",
    "nanobind>=1.3.2",
    "ninja>=1.13.2",
    "pytest>=7.0"
]

[tool.scikit-build]
minimum-version = "0.4"
build-dir = "build"
wheel.packages = []
cmake.build-type = "Release"
editable.rebuild = true
editable.verbose = true

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["python"]
exclude = ["**/node_modules", "**/__pycache__", ".venv", "build"]
extraPaths = ["build"]
reportMissingImports = "warning"
typeCheckingMode = "basic"

