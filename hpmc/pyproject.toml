[build-system]
requires = ["scikit-build-core >=0.4.3", "nanobind >=1.3.2"]
build-backend = "scikit_build_core.build"

[project]
name = "hpmc"
version = "0.0.1"
description = "Hard Particle Monte Carlo Simulation"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy>=1.22.0",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6"
]

[project.optional-dependencies]
dev = [
    "scikit-build-core>=0.10",
    "nanobind>=1.3.2",
    "ninja>=1.13.2",
    "pytest>=7.0"
]

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build"
wheel.py-api = "cp312"

[tool.cibuildwheel]
build-verbosity = 1
